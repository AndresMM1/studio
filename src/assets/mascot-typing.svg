<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Placeholder mascot typing animation - Replace this with your actual mascot SVG -->
  <circle cx="50" cy="50" r="45" fill="#7C3AED" opacity="0.2"/>
  <circle cx="50" cy="50" r="35" fill="#7C3AED" opacity="0.4"/>
  <circle cx="35" cy="40" r="5" fill="#7C3AED"/>
  <circle cx="65" cy="40" r="5" fill="#7C3AED"/>
  <ellipse cx="50" cy="60" rx="15" ry="8" fill="#7C3AED" opacity="0.6"/>
  <!-- Typing dots -->
  <circle cx="40" cy="75" r="2" fill="#7C3AED">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="75" r="2" fill="#7C3AED">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="75" r="2" fill="#7C3AED">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="95" font-family="Arial" font-size="8" text-anchor="middle" fill="#7C3AED">Replace Me!</text>
</svg>
