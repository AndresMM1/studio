variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  # Optimize Node memory for CI
  NODE_OPTIONS: "--max-old-space-size=4096"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: never

# Global Cache Settings
cache: &global_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
    - ${SONAR_USER_HOME}/cache
  policy: pull-push

stages:
  - install
  - test
  - sonarqube
  - deploy

.node-template: &node_template
  image: node:20-alpine
  tags: ['develop']
  before_script:
    - npm config set cache .npm --global

install-dependencies:
  <<: *node_template
  stage: install
  script:
    - echo "Instalando dependencias..."
    - npm ci
  cache:
    <<: *global_cache
  artifacts:
    paths:
      - node_modules/
    expire_in: 2h
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^feature\/.*$/'

build:
  <<: *node_template
  stage: test
  needs:
    - job: install-dependencies
      artifacts: true
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^feature\/.*$/'

test:
  <<: *node_template
  stage: test
  needs:
    - job: install-dependencies
      artifacts: true
  script:
    - npm run coverage
    - npx nyc report --reporter=lcov --reporter=text
  artifacts:
    paths:
      - coverage/
      - .nyc_output/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^feature\/.*$/'

sonarqube:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  tags: ['develop']
  needs:
    - job: test
      artifacts: true
    - job: build
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - |
      EXTRA_COVERAGE=""
      if [ -f coverage/lcov.info ]; then
        EXTRA_COVERAGE="-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info"
        echo "Usando cobertura: coverage/lcov.info"
      else
        echo "No se encontró coverage/lcov.info; Sonar se ejecutará sin cobertura."
      fi
      sonar-scanner \
        -Dsonar.projectKey=productosseti_avc_template-nodejs-typescript_3adee0c5-b47a-4fc4-b0d3-e15c14f3ae47 \
        -Dsonar.sources=src \
        -Dsonar.tests=test \
        -Dsonar.test.inclusions="test/*/.spec.ts" \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.login="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true \
        $EXTRA_COVERAGE
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^feature\/.*$/'

deploy-develop:
  stage: deploy
  image: alpine:3.23
  tags: ['develop']
  needs:
    - job: install-dependencies
      artifacts: true
    - job: test
      artifacts: true
    - job: build
      artifacts: true
    - job: sonarqube
      artifacts: true
  variables:
    HEALTH_PATH: "/health"
    DEPLOY_HOST: "192.168.9.205"
    DEPLOY_USER: "gitlab-runner"
  before_script:
    - apk add --no-cache openssh rsync bash curl
    - mkdir -p /.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_DEV" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      # Prepare remote directory
      ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST "mkdir -p ~/apps/${CI_PROJECT_NAME}"
      
      # Sync files (excluding unnecessary git/node_modules if we want clean install, 
      # but usually we want to send the build artifacts or let docker build handle it.
      # The original script sent ./ which includes everything in current workspace)
      rsync -az --delete -e "ssh -p 22" ./ $DEPLOY_USER@$DEPLOY_HOST:/apps/${CI_PROJECT_NAME}/
      
      # Execute remote deployment script
      ssh -p 22 "$DEPLOY_USER@$DEPLOY_HOST" /usr/bin/env \
        CI_PROJECT_NAME="${CI_PROJECT_NAME}" \
        HEALTH_PATH="${HEALTH_PATH}" \
        DEPLOY_HOST="${DEPLOY_HOST}" \
        bash -s <<'REMOTE'
      set -e
      APP="$CI_PROJECT_NAME"
      HEALTH="$HEALTH_PATH"
      cd ~/apps/"$APP"
      
      # Name sanitization
      RAW_NAME="$APP"
      LOWER=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
      IMAGE_NAME=$(echo "$LOWER" | sed -E 's/[^a-z0-9.-]+/-/g; s/[-.]+/-/g; s/^-+//; s/-+$//')
      [ -n "$IMAGE_NAME" ] || IMAGE_NAME="app-${RANDOM}"
      echo "Usando nombre de imagen: $IMAGE_NAME"
      
      # Build Docker image
      docker build --no-cache -t "${IMAGE_NAME}:latest" .
      
      # Detect Exposed Port
      EXPOSED_JSON=$(docker image inspect "${IMAGE_NAME}:latest" --format '{{json .Config.ExposedPorts}}')
      EXPOSED_PORT=$(echo "$EXPOSED_JSON" | grep -oE '"([0-9]{2,5})/tcp"' | head -n1 | grep -oE '[0-9]{2,5}')
      
      if [ -z "$EXPOSED_PORT" ]; then
        echo "ERROR: No se encontró EXPOSE en Dockerfile."
        exit 1
      fi
      echo "Puerto detectado: $EXPOSED_PORT"
      
      # Deploy Container
      CONTAINER_NAME="${IMAGE_NAME}-dev"
      docker rm -f "$CONTAINER_NAME" || true
      docker run -d --name "$CONTAINER_NAME" --restart unless-stopped -p "$EXPOSED_PORT:$EXPOSED_PORT" "${IMAGE_NAME}:latest"
      
      # Health Check
      echo "Waiting for application to start..."
      for i in $(seq 1 15); do
        if curl -fsS "http://localhost:$EXPOSED_PORT$HEALTH" >/dev/null; then
          echo "Health OK"
          break
        fi
        echo "Esperando app... ($i)"
        sleep 1
      done
      
      echo "Aplicación desplegada en: http://$DEPLOY_HOST:$EXPOSED_PORT"
      REMOTE
  only:
    - master
  environment:
    name: develop
